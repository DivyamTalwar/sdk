[package]
name = "acyclic-stream-models"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
acyclic-stream = { path = ".." }
futures = "0.3.31"
loom = { version = "0.7.2", features = ["futures"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[[test]]
name = "session_model"
path = "session_model.rs"

[workspace]
members = ["."]
