[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
acyclic-harness = { path = "..", features = ["filesystem", "test-support"] }
diffy = "=0.5.2"
libfuzzer-sys = "=0.4.10"
serde_json = "=1.0.151"

[[bin]]
name = "client_diff"
path = "fuzz_targets/client_diff.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
