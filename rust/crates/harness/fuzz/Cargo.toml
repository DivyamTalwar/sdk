[package]
name = "acyclic-harness-local-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
notifications = ["acyclic-harness/test-support", "acyclic-harness/filesystem-local", "acyclic-harness/mcp-http"]

[dependencies]
libfuzzer-sys = "0.4"
prost.workspace = true
bytes.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true, features = ["codec"] }
which = "=8.0.6"
acyclic-harness = { path = "..", default-features = false, features = ["filesystem-local", "native-execution", "test-support"] }

[[bin]]
name = "command"
path = "fuzz_targets/command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_identity"
path = "fuzz_targets/protocol_identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_output"
path = "fuzz_targets/hook_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "goal_parser"
path = "fuzz_targets/goal_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_stdio_codec"
path = "fuzz_targets/mcp_stdio_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_executable"
path = "fuzz_targets/mcp_executable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_diff"
path = "fuzz_targets/client_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_parser"
path = "fuzz_targets/command_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "notification_scenario"
path = "fuzz_targets/notification_scenario.rs"
required-features = ["notifications"]
test = false
doc = false
bench = false

[[bin]]
name = "input_paths"
path = "fuzz_targets/input_paths.rs"
test = false
doc = false
bench = false
