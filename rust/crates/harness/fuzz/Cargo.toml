[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
acyclic-harness = { path = "..", features = ["filesystem", "test-support"] }
diffy = "=0.5.2"
libfuzzer-sys = "0.4"
bytes = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
serde = "1"
serde_json = "1"
tokio-util = { version = "0.7", features = ["codec"] }
which = "=8.0.6"

[[bin]]
name = "mcp_stdio_codec"
path = "fuzz_targets/mcp_stdio_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_executable"
path = "fuzz_targets/mcp_executable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_diff"
path = "fuzz_targets/client_diff.rs"
test = false
doc = false
bench = false
