[package]
name = "acyclic-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
acyclic-harness = { path = "..", default-features = false, features = ["filesystem-local", "native-execution", "test-support"] }

[[bin]]
name = "command"
path = "fuzz_targets/command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false
