[package]
name = "acyclic-terminal-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows console ABI bindings for terminal restoration"

[target.'cfg(windows)'.dependencies]
cxx = "1"

[target.'cfg(windows)'.build-dependencies]
cxx-build = "1"

# This ABI boundary contains CXX-generated unsafe code. The consumer retains
# workspace unsafe_code=deny; no handwritten Rust pointer operations live here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
