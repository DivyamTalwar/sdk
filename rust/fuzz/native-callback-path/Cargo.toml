[package]
name = "native-callback-path-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1.48.0", default-features = false, features = ["io-util"] }

[[bin]]
name = "callback_path"
path = "fuzz_targets/callback_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_output"
path = "fuzz_targets/metadata_output.rs"
test = false
doc = false
bench = false
